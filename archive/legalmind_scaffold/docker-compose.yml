version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.api.tasks worker --loglevel=info
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - qdrant
      - redis

volumes:
  qdrant_data:
  redis_data:
