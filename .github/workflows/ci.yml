name: ci
on: [push, pull_request]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - name: Install (CPU torch keeps the job small)
        working-directory: backend
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt scikit-learn joblib pandas pyarrow pyyaml requests
      - name: Tests (fake embeddings, no network or keys needed)
        working-directory: backend
        run: python -m pytest -q
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fail if a .env file or an API-key-looking string is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "tracked .env file"; exit 1; fi
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{32,}' -- . ':!*.md'; then echo "possible API key committed"; exit 1; fi
