# Single source of truth for every dataset in the LegalMind 2.0 roadmap (Section 3).
# access.kind: s3 | hf | manual   (manual = needs a human step: registration, ToS, scraping rules)
# status: ready (automated fetch implemented) | manual (instructions only)
# Licences marked "verify" were NOT checked against the dataset card; confirm before use.
datasets:
  # ---------------- 3.1 Indian case law ----------------
  - id: sc_judgments
    name: Indian Supreme Court Judgments (AWS Open Data)
    section: "3.1"
    priority: P0
    license: CC-BY-4.0 (verified in roadmap)
    attribution: "Dattam Labs / AWS Open Data registry"
    use: Core corpus; scans for OCR/visual tests; citation pairs
    access: {kind: s3, bucket: indian-supreme-court-judgments, prefix: "data/tar/year={year}/english/english.tar", meta_prefix: "metadata/json/year={year}/"}
  - id: hc_judgments
    name: Indian High Court Judgments (AWS Open Data)
    section: "3.1"
    priority: P1
    license: CC-BY-4.0 (verified in roadmap)
    attribution: "Dattam Labs / AWS Open Data registry"
    use: Scale-up tier, cross-document search, throughput tests
    access: {kind: s3, bucket: indian-high-court-judgments, prefix: "data/", meta_prefix: "metadata/"}
  - id: il_tur
    name: IL-TUR benchmark (includes IL-PCR, ILDC/CJPE, legal NER, statute ID, rhetorical roles, summarisation, HLDC bail)
    section: "3.1"
    priority: P1
    license: CC-BY-NC-SA-4.0 (non-commercial; verified on HF card)
    use: Indian legal eval; PCR queries/candidates, NER, rhetorical roles, statute identification
    access: {kind: hf, repo: Exploration-Lab/IL-TUR, allow_patterns: ["README.md", "pcr/*", "lner/*", "lsi/*", "rr/*", "summ/*", "lmt/*", "cjpe/expert*", "cjpe/test*", "bail/dev_specific*"]}
  - id: aila_ilpcr
    name: AILA / FIRE tracks and IL-PCR
    section: "3.1"
    priority: P0
    license: verify (FIRE registration may be required)
    use: Gold Indian precedent/statute retrieval eval (also mirrored in MTEB AILACasedocs/AILAStatutes)
    access: {kind: manual, url: "https://sites.google.com/view/fire-2019-aila/ (full IL-PCR: github Exploration-Lab/IL-PCR)"}
  - id: aila_casedocs
    name: AILA case documents (MTEB/BEIR-format mirror)
    section: "3.1"
    priority: P0
    license: verify
    use: Indian prior-case retrieval eval (ablation rows)
    access: {kind: hf, repo: mteb/AILA_casedocs}
  - id: aila_statutes
    name: AILA statutes (MTEB/BEIR-format mirror)
    section: "3.1"
    priority: P0
    license: verify
    use: Indian statute retrieval eval
    access: {kind: hf, repo: mteb/AILA_statutes}
  - id: ildc
    name: ILDC / CJPE (Indian Legal Documents Corpus)
    section: "3.1"
    priority: P2
    license: CC-BY-NC (non-commercial)
    use: Outcome-explanation analysis only (see Section 9); also inside IL-TUR cjpe/
    access: {kind: manual, url: "https://github.com/Exploration-Lab/CJPE"}
  - id: opennyai
    name: OpenNyAI datasets (NER, rhetorical roles)
    section: "3.1"
    priority: P1
    license: verify
    use: Legal NER, rhetorical-role tagger
    access: {kind: manual, url: "https://huggingface.co/opennyaiorg"}
  - id: in_abs
    name: IN-Abs / IN-Ext / UK-Abs summarisation (Zenodo 7152317)
    section: "3.1"
    priority: P1
    license: CC-BY-4.0 (verified on Zenodo)
    attribution: "Shukla et al. 2022, Legal Case Document Summarization (doi 10.5281/zenodo.7152317)"
    use: Judgment summariser
    access: {kind: url, url: "https://zenodo.org/api/records/7152317/files/dataset.zip/content", filename: dataset.zip}
  - id: hldc
    name: HLDC (Hindi Legal Documents Corpus)
    section: "3.1"
    priority: P2
    license: CC-BY-NC (non-commercial); bail subset inside IL-TUR
    use: Hindi legal retrieval
    access: {kind: manual, url: "https://github.com/Exploration-Lab/HLDC"}
  - id: indian_kanoon
    name: Indian Kanoon (small permitted sample / official API only)
    section: "3.1"
    priority: P2
    license: ToS restricts bulk scraping
    use: Small sample only
    access: {kind: manual, url: "https://api.indiankanoon.org/"}
  # ---------------- 3.2 Statutes ----------------
  - id: india_code
    name: India Code (Central and State Acts)
    section: "3.2"
    priority: P0
    license: Govt publication; read site terms
    use: Statute corpus, section linking
    access: {kind: manual, url: "https://www.indiacode.nic.in/"}
  - id: bns_mapping
    name: BNS/BNSS/BSA <-> IPC/CrPC/Evidence Act mapping
    section: "3.2"
    priority: P0
    license: Govt publication
    use: Old-to-new section mapper (implemented in backend/app/legal/section_mapper.py)
    access: {kind: manual, url: "https://www.mha.gov.in/en/commoncontent/new-criminal-laws"}
  - id: constitution
    name: Constitution of India
    section: "3.2"
    priority: P0
    license: Govt publication
    use: Fundamental rights questions
    access: {kind: manual, url: "https://legislative.gov.in/constitution-of-india/"}
  - id: key_statutes
    name: Key commercial/civil statutes (Contract Act ... DPDP Act)
    section: "3.2"
    priority: P0
    license: Govt publication
    use: Clause to statute linking
    access: {kind: manual, url: "https://www.indiacode.nic.in/"}
  - id: gazette
    name: Gazette of India notifications
    section: "3.2"
    priority: P2
    license: Govt publication
    use: Amendment tracking
    access: {kind: manual, url: "https://egazette.gov.in/"}
  - id: law_commission
    name: Law Commission of India reports
    section: "3.2"
    priority: P2
    license: Govt publication
    use: Long-form summarisation
    access: {kind: manual, url: "https://lawcommissionofindia.nic.in/"}
  - id: regulator_orders
    name: SEBI/RBI/NCLT/CCI/ITAT/TRAI orders
    section: "3.2"
    priority: P2
    license: check regulator terms
    use: Domain packs
    access: {kind: manual, url: "official regulator websites"}
