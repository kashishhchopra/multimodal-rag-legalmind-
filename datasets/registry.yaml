    access: {kind: manual, url: "https://github.com/applicaai/kleister-nda"}
  - id: sec_contracts
    name: SEC EDGAR material contracts (Exhibit 10)
    section: "3.3"
    priority: P1
    license: Public filings; follow SEC fair-access rules
    use: Contract corpus at scale
    access: {kind: hf, repo: chenghao/sec-material-contracts}
  - id: indian_contracts
    name: Indian contract samples / templates
    section: "3.3"
    priority: P1
    license: check each source
    use: Indian clause realism (stamp duty, seat, jurisdiction)
    access: {kind: manual, url: "public e-procurement portals and open templates"}
  # ---------------- 3.4 QA / instruction ----------------
  - id: aalap
    name: Aalap instruction dataset (OpenNyAI)
    section: "3.4"
    priority: P1
    license: verify
    use: Generator fine-tuning
    access: {kind: hf, repo: opennyaiorg/aalap_instruction_dataset}
  - id: legalbench
    name: LegalBench
    section: "3.4"
    priority: P1
