    access: {kind: hf, repo: coastalcph/lex_glue}
  - id: acord
    name: ACORD
    section: "3.3"
    priority: P1
    license: verify
    use: Contract clause retrieval eval
    access: {kind: manual, url: "https://www.atticusprojectai.org/acord"}
  - id: maud
    name: MAUD (part of LegalBench)
    section: "3.3"
    priority: P2
    license: verify
